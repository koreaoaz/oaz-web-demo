name: Demo 검증 및 수동 Draft 배포

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 회귀 테스트 및 빌드
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ctbwaqtqubmjmltbxfzm.supabase.co
      NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 브라우저 테스트 실행 조건 확인
        shell: pwsh
        run: |
          if (-not ((Test-Path 'C:/Program Files/Google/Chrome/Application/chrome.exe') -or (Test-Path 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'))) { throw '브라우저 회귀 테스트를 실행할 수 없습니다.' }
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm run build
      - name: 검증 커밋 기록
        run: echo "검증 커밋 $env:GITHUB_SHA"

  draft:
    name: 승인된 main의 수동 Draft 배포
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: netlify-draft
    env:
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/netlify
      - name: 기존 Demo 사이트 확인
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node .github/scripts/verify-netlify-site.mjs
      - name: Netlify Next.js 빌드
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: tools/netlify/node_modules/.bin/netlify build --context deploy-preview
      - name: Draft 배포
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: tools/netlify/node_modules/.bin/netlify deploy --no-build --context deploy-preview --message "Demo draft $GITHUB_SHA"
      - name: 배포 커밋 기록
        run: echo "배포 커밋 $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
